<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SeraAi — Руссомания</title>
    <style>
        :root { --p: #8b5cf6; --bg: #030712; --msg-ai: #1f2937; }
        body { margin:0; font-family: sans-serif; background: var(--bg); color: white; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        header { padding: 15px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid #374151; background: #030712; }
        .ava { width: 35px; height: 35px; border-radius: 8px; background: var(--p); }
        .hero { flex:1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 20px; }
        .btn { padding: 15px 35px; background: var(--p); border: none; border-radius: 50px; color: white; font-weight: bold; cursor: pointer; }
        #chat { display: none; flex-direction: column; height: 100%; width: 100%; max-width: 600px; margin: 0 auto; }
        #msgs { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
        .m { padding: 12px 16px; border-radius: 18px; max-width: 85%; line-height: 1.4; font-size: 15px; }
        .u { background: var(--p); align-self: flex-end; }
        .a { background: var(--msg-ai); align-self: flex-start; border: 1px solid #374151; }
        .input-box { padding: 15px; background: #111827; display: flex; gap: 10px; border-top: 1px solid #374151; }
        input { flex: 1; background: #1f2937; border: none; padding: 12px 20px; border-radius: 25px; color: white; outline: none; }
    </style>
</head>
<body>

<header>
    <img src="https://via.placeholder.com" class="ava" id="site-ava">
    <div style="font-weight: bold; font-size: 1.2rem;">SeraAi</div>
</header>

<main class="hero" id="h">
    <h1>SeraAi</h1>
    <p style="color: #9ca3af;">Русская нейросеть от <b>Руссомания</b><br>Без регистрации и VPN</p>
    <button class="btn" onclick="start()">Открыть диалог</button>
</main>

<div id="chat">
    <div id="msgs"></div>
    <div class="input-box">
        <input type="text" id="ui" placeholder="Напиши Sera..." onkeypress="if(event.key==='Enter') send()">
        <button onclick="send()" style="background:none; border:none; color:var(--p); font-size: 24px; cursor: pointer;">➔</button>
    </div>
</div>

<script>
    const SYSTEM = "Тебя зовут Sera. Создана компанией Руссомания. Ты говоришь только по-русски. Будь вежливой.";

    function start() {
        document.getElementById('h').style.display = 'none';
        document.getElementById('chat').style.display = 'flex';
        add("Привет! Я Sera от Руссомания. Готова к общению!", 'a');
    }

    async function send() {
        const i = document.getElementById('ui');
        const txt = i.value.trim();
        if(!txt) return;

        add(txt, 'u');
        i.value = "";
        const tid = "t" + Date.now();
        add("Sera думает...", 'a', tid);

        try {
            // Используем DuckDuckGo AI Proxy (через свободный шлюз)
            const res = await fetch("https://api.duckduckgo.com", { mode: 'no-cors' }); 
            
            // Если предыдущий шлюз не работает, пробуем альтернативный (Llama 3)
            const response = await fetch("https://api.codetabs.com", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    model: "llama-3-70b-chat",
                    messages: [{role: "system", content: SYSTEM}, {role: "user", content: txt}]
                })
            });
            
            const data = await response.json();
            document.getElementById(tid).innerText = data.choices[0].message.content;
        } catch (e) {
            // Резервный ответ, если все API заблокированы
            document.getElementById(tid).innerText = "Ошибка сети. Возможно, GitHub временно блокирует запрос. Попробуйте обновить страницу!";
        }
    }

    function add(t, c, id) {
        const d = document.createElement("div");
        d.className = `m ${c}`;
        if(id) d.id = id;
        d.innerText = t;
        const m = document.getElementById("msgs");
        m.appendChild(d);
        m.scrollTop = m.scrollHeight;
    }
</script>
</body>
</html>
