<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SeraAi — Русская нейросеть</title>
    <style>
        :root {
            --primary: #6366f1;
            --bg: #0f172a;
            --glass: rgba(255, 255, 255, 0.07);
            --text: #f8fafc;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: radial-gradient(circle at top right, #1e1b4b, #0f172a);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* Шапка */
        header {
            padding: 1rem 5%;
            display: flex;
            align-items: center;
            gap: 12px;
            backdrop-filter: blur(15px);
            border-bottom: 1px solid var(--glass);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            background: var(--primary);
            object-fit: cover;
            border: 2px solid rgba(99, 102, 241, 0.5);
        }

        .site-name {
            font-size: 1.3rem;
            font-weight: 800;
            background: linear-gradient(90deg, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Главный экран */
        .hero {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
        }

        .hero h1 {
            font-size: 2.5rem;
            max-width: 600px;
            margin-bottom: 1rem;
            line-height: 1.2;
        }

        .hero p {
            color: #94a3b8;
            font-size: 1.1rem;
            margin-bottom: 2rem;
            max-width: 500px;
        }

        .btn-open {
            padding: 14px 32px;
            font-size: 1rem;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 600;
            box-shadow: 0 10px 20px -5px rgba(99, 102, 241, 0.5);
            transition: 0.3s;
        }

        .btn-open:active { transform: scale(0.95); }

        /* Окно чата */
        #chat-container {
            display: none;
            flex-direction: column;
            height: calc(100vh - 70px);
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            background: rgba(15, 23, 42, 0.8);
        }

        #messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .msg {
            padding: 12px 16px;
            border-radius: 18px;
            max-width: 85%;
            font-size: 0.95rem;
            line-height: 1.4;
            word-wrap: break-word;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        .user-msg { background: var(--primary); align-self: flex-end; border-bottom-right-radius: 4px; }
        .ai-msg { background: var(--glass); align-self: flex-start; border-bottom-left-radius: 4px; border: 1px solid rgba(255,255,255,0.1); }

        .chat-input-area {
            padding: 15px;
            background: #1e293b;
            display: flex;
            gap: 8px;
            padding-bottom: env(safe-area-inset-bottom, 15px);
        }

        input {
            flex: 1;
            background: #0f172a;
            border: 1px solid var(--glass);
            padding: 12px 16px;
            border-radius: 25px;
            color: white;
            outline: none;
            font-size: 1rem;
        }

        .status { font-size: 0.75rem; color: #818cf8; text-align: center; padding: 8px; background: rgba(0,0,0,0.2); }
    </style>
</head>
<body>

    <header>
        <img src="https://via.placeholder.com" alt="SeraAi" class="avatar" id="site-logo">
        <div class="site-name">SeraAi</div>
    </header>

    <main class="hero" id="hero">
        <h1>Русская нейросеть от русских разработчиков</h1>
        <p>Доступна прямо в браузере.<br>ПОКА без регистрации.</p>
        <button class="btn-open" onclick="startChat()">Открыть диалог</button>
    </main>

    <div id="chat-container">
        <div class="status" id="status">Sera готова к общению</div>
        <div id="messages"></div>
        <div class="chat-input-area">
            <input type="text" id="user-input" placeholder="Сообщение для Sera..." onkeypress="if(event.key==='Enter') sendMessage()">
            <button onclick="sendMessage()" style="background:none; border:none; color:var(--primary); font-weight:bold; cursor:pointer; padding:0 10px;">Отпр.</button>
        </div>
    </div>

    <script>
        const SYSTEM_PROMPT = "Тебя зовут Sera. Тебя создала компания Руссомания. Ты — продвинутая русская нейросеть. Ты разговариваешь ТОЛЬКО на русском языке. Будь вежливой, краткой и умной.";

        // Используем модель Qwen, она отлично понимает русский
        async function queryAI(userText) {
            try {
                const response = await fetch(
                    "https://api-inference.huggingface.co",
                    {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ 
                            inputs: `<|im_start|>system\n${SYSTEM_PROMPT}<|im_end|>\n<|im_start|>user\n${userText}<|im_end|>\n<|im_start|>assistant\n`,
                            parameters: { max_new_tokens: 500, return_full_text: false }
                        }),
                    }
                );
                const result = await response.json();
                
                // Обработка разных форматов ответа Hugging Face
                let answer = "";
                if (Array.isArray(result)) answer = result[0].generated_text;
                else answer = result.generated_text;

                return answer || "Я не смогла сформировать ответ, попробуйте еще раз.";
            } catch (e) {
                console.error(e);
                return "Ошибка подключения к серверу Руссомания.";
            }
        }

        function startChat() {
            document.getElementById("hero").style.display = "none";
            document.getElementById("chat-container").style.display = "flex";
            addMessage("Привет! Я Sera. Чем я могу помочь вам сегодня?", 'ai-msg');
        }

        async function sendMessage() {
            const input = document.getElementById("user-input");
            const text = input.value.trim();
            if (!text) return;

            addMessage(text, 'user-msg');
            input.value = "";
            
            const typingId = "typing-" + Date.now();
            addMessage("Sera думает...", 'ai-msg', typingId);
            document.getElementById("status").innerText = "Sera печатает...";
            
            const answer = await queryAI(text);
            
            const typingElement = document.getElementById(typingId);
            if (typingElement) {
                typingElement.innerText = answer.trim();
            }
            document.getElementById("status").innerText = "Онлайн";
        }

        function addMessage(text, className, id = null) {
            const div = document.createElement("div");
            div.className = `msg ${className}`;
            if (id) div.id = id;
            div.innerText = text;
            const container = document.getElementById("messages");
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }
    </script>
</body>
</html>
