<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SeraAi — Руссомания</title>
    <style>
        :root { --p: #7c3aed; --bg: #0b0f1a; --glass: rgba(255,255,255,0.05); }
        body { margin: 0; font-family: sans-serif; background: var(--bg); color: white; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        header { padding: 15px 20px; display: flex; align-items: center; gap: 12px; background: rgba(0,0,0,0.3); backdrop-filter: blur(10px); border-bottom: 1px solid var(--glass); }
        .ava { width: 40px; height: 40px; border-radius: 10px; background: var(--p); border: 1px solid rgba(255,255,255,0.2); }
        .hero { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 20px; }
        .btn { padding: 16px 35px; background: var(--p); border: none; border-radius: 50px; color: white; font-weight: bold; cursor: pointer; box-shadow: 0 8px 20px rgba(124, 58, 237, 0.3); }
        #chat { display: none; flex-direction: column; height: 100%; width: 100%; max-width: 600px; margin: 0 auto; }
        #msgs { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
        .m { padding: 12px 16px; border-radius: 18px; max-width: 80%; font-size: 15px; line-height: 1.4; }
        .u { background: var(--p); align-self: flex-end; }
        .a { background: #1e293b; align-self: flex-start; }
        .in-area { padding: 15px; background: #161b2a; display: flex; gap: 10px; border-top: 1px solid var(--glass); }
        input { flex: 1; background: #0b0f1a; border: 1px solid #334155; padding: 12px 18px; border-radius: 25px; color: white; outline: none; }
    </style>
</head>
<body>

<header>
    <img src="https://img.icons8.com" class="ava">
    <div style="font-weight: bold; font-size: 1.2rem;">SeraAi</div>
</header>

<main class="hero" id="h">
    <h1 style="font-size: 2.5rem; margin-bottom: 10px;">SeraAi</h1>
    <p style="color: #94a3b8;">Русская нейросеть от <b>Руссомания</b></p>
    <button class="btn" onclick="start()">Открыть диалог</button>
</main>

<div id="chat">
    <div id="msgs"></div>
    <div style="font-size: 10px; color: #6366f1; text-align: center; padding: 5px;" id="st"></div>
    <div class="in-area">
        <input type="text" id="ui" placeholder="Напиши Sera..." onkeypress="if(event.key==='Enter') send()">
        <button onclick="send()" style="background:var(--p); border:none; width:42px; height:42px; border-radius:50%; color:white; cursor:pointer;">➔</button>
    </div>
</div>

<script>
    const PROMPT = "Тебя зовут Sera. Тебя создала компания Руссомания. Ты говоришь только на русском языке.";

    function start() {
        document.getElementById('h').style.display = 'none';
        document.getElementById('chat').style.display = 'flex';
        add("Привет! Я Sera. Как ваши дела?", 'a');
    }

    async function send() {
        const ui = document.getElementById('ui');
        const txt = ui.value.trim();
        if(!txt) return;

        add(txt, 'u');
        ui.value = "";
        
        const tid = "t" + Date.now();
        add("Sera думает...", 'a', tid);
        document.getElementById('st').innerText = "Запрос отправлен...";

        try {
            const res = await fetch("/api/chat", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ text: txt, system: PROMPT })
            });

            const data = await res.json();
            // Получаем ответ из поля reply, которое мы настроили в бэкенде
            document.getElementById(tid).innerText = data.reply || "Ошибка данных";
        } catch (e) {
            document.getElementById(tid).innerText = "Ошибка соединения.";
        } finally {
            document.getElementById('st').innerText = "";
        }
    }

    function add(t, c, id) {
        const d = document.createElement("div");
        d.className = `m ${c}`;
        if(id) d.id = id;
        d.innerText = t;
        const ms = document.getElementById("msgs");
        ms.appendChild(d);
        ms.scrollTop = ms.scrollHeight;
    }
</script>
</body>
</html>
