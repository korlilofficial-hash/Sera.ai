<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SeraAi — Русская нейросеть</title>
    <style>
        :root { --primary: #6366f1; --bg: #0f172a; --glass: rgba(255, 255, 255, 0.07); --text: #f8fafc; }
        body { margin: 0; font-family: sans-serif; background: radial-gradient(circle at top right, #1e1b4b, #0f172a); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }
        header { padding: 1rem; display: flex; align-items: center; gap: 12px; backdrop-filter: blur(15px); border-bottom: 1px solid var(--glass); }
        .avatar { width: 40px; height: 40px; border-radius: 10px; background: var(--primary); }
        .site-name { font-size: 1.3rem; font-weight: 800; background: linear-gradient(90deg, #818cf8, #c084fc); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .hero { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 20px; }
        .btn-open { padding: 15px 35px; background: var(--primary); color: white; border: none; border-radius: 50px; font-weight: bold; cursor: pointer; box-shadow: 0 10px 20px rgba(99,102,241,0.4); }
        #chat-container { display: none; flex-direction: column; height: 90vh; width: 100%; max-width: 600px; margin: 0 auto; background: rgba(15,23,42,0.9); border-radius: 20px 20px 0 0; }
        #messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
        .msg { padding: 12px; border-radius: 15px; max-width: 80%; font-size: 14px; }
        .user-msg { background: var(--primary); align-self: flex-end; }
        .ai-msg { background: var(--glass); align-self: flex-start; border: 1px solid rgba(255,255,255,0.1); }
        .chat-area { padding: 15px; display: flex; gap: 5px; background: #1e293b; }
        input { flex: 1; background: #0f172a; border: 1px solid var(--glass); padding: 10px; border-radius: 20px; color: white; }
    </style>
</head>
<body>

<header>
    <img src="https://via.placeholder.com" class="avatar">
    <div class="site-name">SeraAi</div>
</header>

<main class="hero" id="hero">
    <h1>Русская нейросеть</h1>
    <p>Создано Руссомания. Без регистрации.</p>
    <button class="btn-open" onclick="startChat()">Начать диалог</button>
</main>

<div id="chat-container">
    <div id="messages"></div>
    <div class="chat-area">
        <input type="text" id="user-input" placeholder="Напиши Sera...">
        <button onclick="sendMessage()" style="color:white; background:none; border:none; font-weight:bold;">></button>
    </div>
</div>

<script>
    const PROMPT = "Тебя зовут Sera. Создатель: Руссомания. Говори только по-русски.";

    function startChat() {
        document.getElementById("hero").style.display = "none";
        document.getElementById("chat-container").style.display = "flex";
        addMessage("Привет! Я Sera от Руссомания. О чем пообщаемся?", 'ai-msg');
    }

    async function sendMessage() {
        const input = document.getElementById("user-input");
        const text = input.value.trim();
        if(!text) return;

        addMessage(text, 'user-msg');
        input.value = "";
        
        const tempId = "t-" + Date.now();
        addMessage("Sera думает...", 'ai-msg', tempId);

        try {
            // Используем надежный бесплатный API шлюз (CORS Proxy + Free LLM)
            const response = await fetch(`https://open-ai-api-production.up.railway.app`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    model: "gpt-3.5-turbo", // Эмуляция через бесплатный мост
                    messages: [
                        {role: "system", content: PROMPT},
                        {role: "user", content: text}
                    ]
                })
            });
            const data = await response.json();
            document.getElementById(tempId).innerText = data.choices[0].message.content;
        } catch (e) {
            document.getElementById(tempId).innerText = "Ошибка сервера. Попробуй позже!";
        }
    }

    function addMessage(t, c, id) {
        const d = document.createElement("div");
        d.className = `msg ${c}`;
        if(id) d.id = id;
        d.innerText = t;
        const m = document.getElementById("messages");
        m.appendChild(d);
        m.scrollTop = m.scrollHeight;
    }
</script>
</body>
</html>
