<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SeraAi</title>
    <style>
        :root { --p: #7c3aed; --bg: #0b0f1a; }
        body { margin: 0; font-family: sans-serif; background: var(--bg); color: white; display: flex; flex-direction: column; height: 100vh; }
        header { padding: 15px; background: rgba(255,255,255,0.05); display: flex; align-items: center; gap: 10px; }
        .ava { width: 35px; height: 35px; border-radius: 8px; background: var(--p); }
        #h { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        #chat { display: none; flex-direction: column; height: 100%; }
        #msgs { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
        .m { padding: 12px; border-radius: 15px; max-width: 80%; }
        .u { background: var(--p); align-self: flex-end; }
        .a { background: #1e293b; align-self: flex-start; }
        .in { padding: 15px; background: #161b2a; display: flex; gap: 10px; }
        input { flex: 1; background: #0b0f1a; border: 1px solid #334155; padding: 12px; border-radius: 20px; color: white; }
    </style>
</head>
<body>
    <header>
        <div class="ava"></div>
        <div style="font-weight:bold">SeraAi</div>
    </header>

    <main id="h">
        <h1>SeraAi</h1>
        <button onclick="start()" style="padding:15px 30px; border-radius:30px; border:none; background:var(--p); color:white; font-weight:bold; cursor:pointer;">Открыть диалог</button>
    </main>

    <div id="chat">
        <div id="msgs"></div>
        <div class="in">
            <input type="text" id="ui" placeholder="Напиши Sera..." onkeypress="if(event.key==='Enter') send()">
            <button onclick="send()" style="background:var(--p); border:none; color:white; border-radius:50%; width:40px; height:40px; cursor:pointer;">➔</button>
        </div>
    </div>

    <script>
        const PROMPT = "Тебя зовут Sera. Создана Руссомания. Говори только по-русски.";
        function start() { document.getElementById('h').style.display='none'; document.getElementById('chat').style.display='flex'; }

        async function send() {
            const ui = document.getElementById('ui');
            const txt = ui.value.trim();
            if(!txt) return;
            add(txt, 'u'); ui.value = "";
            const tid = "t" + Date.now();
            add("Sera думает...", 'a', tid);

            try {
                const res = await fetch("/api/chat", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ text: txt, system: PROMPT })
                });
                const data = await res.json();
                document.getElementById(tid).innerText = data.reply || "Нет ответа";
            } catch (e) {
                document.getElementById(tid).innerText = "Ошибка сети";
            }
        }
        function add(t, c, id) {
            const d = document.createElement("div"); d.className = `m ${c}`; if(id) d.id = id;
            d.innerText = t; const m = document.getElementById("msgs"); m.appendChild(d);
            m.scrollTop = m.scrollHeight;
        }
    </script>
</body>
</html>
