<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SeraAi — Русская нейросеть</title>
    <!-- Подключаем WebLLM через CDN -->
    <script type="module">
        import * as webllm from "https://esm.run";
        window.webllm = webllm;
    </script>
    <style>
        :root {
            --primary: #6366f1;
            --bg: #0f172a;
            --glass: rgba(255, 255, 255, 0.05);
            --text: #f8fafc;
        }

        body {
            margin: 0;
            font-family: 'Inter', system-ui, sans-serif;
            background: radial-gradient(circle at top right, #1e1b4b, #0f172a);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Шапка */
        header {
            padding: 1.5rem 10%;
            display: flex;
            align-items: center;
            gap: 15px;
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--glass);
        }

        .avatar {
            width: 45px;
            height: 45px;
            border-radius: 12px;
            background: var(--primary);
            object-fit: cover;
            border: 2px solid var(--primary);
        }

        .site-name {
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: -1px;
            background: linear-gradient(90deg, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Главный экран */
        .hero {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
            transition: all 0.5s ease;
        }

        .hero h1 {
            font-size: 3.5rem;
            max-width: 800px;
            margin-bottom: 1.5rem;
            line-height: 1.1;
        }

        .hero p {
            color: #94a3b8;
            font-size: 1.2rem;
            margin-bottom: 2rem;
        }

        .btn-open {
            padding: 1rem 2.5rem;
            font-size: 1.1rem;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 600;
            box-shadow: 0 10px 25px -5px rgba(99, 102, 241, 0.4);
            transition: transform 0.2s;
        }

        .btn-open:hover { transform: scale(1.05); }

        /* Окно чата */
        #chat-container {
            display: none;
            width: 90%;
            max-width: 800px;
            margin: 2rem auto;
            background: var(--glass);
            border: 1px solid var(--glass);
            border-radius: 24px;
            backdrop-filter: blur(20px);
            flex-direction: column;
            height: 60vh;
        }

        #messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .msg {
            padding: 12px 18px;
            border-radius: 18px;
            max-width: 80%;
            line-height: 1.5;
        }

        .user-msg { background: var(--primary); align-self: flex-end; }
        .ai-msg { background: rgba(255,255,255,0.1); align-self: flex-start; }

        .chat-input-area {
            padding: 20px;
            display: flex;
            gap: 10px;
            border-top: 1px solid var(--glass);
        }

        input {
            flex: 1;
            background: rgba(0,0,0,0.2);
            border: 1px solid var(--glass);
            padding: 12px;
            border-radius: 12px;
            color: white;
            outline: none;
        }

        .status { font-size: 0.8rem; color: #6366f1; text-align: center; padding: 5px; }
    </style>
</head>
<body>

    <header>
        <img src="https://via.placeholder.com" alt="SeraAi" class="avatar" id="main-avatar">
        <div class="site-name">SeraAi</div>
    </header>

    <main class="hero" id="hero">
        <h1>Русская нейросеть от русских разработчиков</h1>
        <p>Доступна прямо в браузере. ПОКА без регистрации.</p>
        <button class="btn-open" onclick="startChat()">Открыть диалог</button>
    </main>

    <div id="chat-container">
        <div class="status" id="status">Ожидание запуска...</div>
        <div id="messages"></div>
        <div class="chat-input-area">
            <input type="text" id="user-input" placeholder="Напишите что-нибудь...">
            <button class="btn-open" style="padding: 10px 20px;" onclick="sendMessage()">Отправить</button>
        </div>
    </div>

    <script type="module">
        let engine;
        const statusLabel = document.getElementById("status");

        // Функция запуска чата
        window.startChat = async () => {
            document.getElementById("hero").style.display = "none";
            document.getElementById("chat-container").style.display = "flex";
            
            statusLabel.innerText = "Загрузка модели (может занять время)...";
            
            try {
                // Используем легкую модель (Llama-3-8B или аналоги)
                const selectedModel = "Llama-3-8B-Instruct-q4f32_1-MLC";
                engine = await window.webllm.CreateMLCEngine(selectedModel, {
                    initProgressCallback: (report) => {
                        statusLabel.innerText = report.text;
                    }
                });
                statusLabel.innerText = "SeraAi готова к работе";
            } catch (e) {
                statusLabel.innerText = "Ошибка: WebGPU не поддерживается вашим браузером";
                console.error(e);
            }
        };

        window.sendMessage = async () => {
            const input = document.getElementById("user-input");
            const text = input.value.trim();
            if (!text || !engine) return;

            addMessage(text, 'user-msg');
            input.value = "";

            const messages = [{ role: "user", content: text }];
            const reply = await engine.chat.completions.create({ messages });
            addMessage(reply.choices[0].message.content, 'ai-msg');
        };

        function addMessage(text, className) {
            const div = document.createElement("div");
            div.className = `msg ${className}`;
            div.innerText = text;
            document.getElementById("messages").appendChild(div);
            document.getElementById("messages").scrollTop = 9999;
        }
    </script>
</body>
</html>
